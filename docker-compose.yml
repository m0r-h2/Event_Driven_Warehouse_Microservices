services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  inventory_api:
    build: .
    command: python -m inventory_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://warehouse:warehouse@postgres:5432/warehouse
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  analytics_worker:
    build: .
    entrypoint: ["python"]
    command: ["-m", "analytics_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://warehouse:warehouse@postgres:5432/warehouse
      REDIS_URL: redis://redis:6379/0
      SKIP_MIGRATIONS: "1"
      CATCH_UP_INTERVAL_SEC: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventory_api:
        condition: service_healthy

volumes:
  pgdata:
